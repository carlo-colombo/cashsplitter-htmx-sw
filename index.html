
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CashSplitter</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/dexie@3.2.3/dist/dexie.js"></script>
    <style>
      body, .modal-card, .modal-background {
        background-color: #fdf9e8 !important; /* Slightly yellow page */
      }
      h1, h2, h3, h4, h5, h6, p, a, .title, .subtitle, .label, .button, .input, .modal-card-title, .modal-card-foot .button, .footer, .content {
        color: #4b0082 !important; /* Blu-purple pen like lines */
      }

      .button {
        background-color: #e6e6fa !important;
        border-color: #4b0082 !important;
      }
      .button.is-primary {
        background-color: #6a5acd !important;
        border-color: transparent !important;
        color: #fdf9e8 !important;
      }
      .button.is-success {
        background-color: #9370db !important;
        border-color: transparent !important;
        color: #fdf9e8 !important;
      }

      .input {
        background-color: #fffacd !important;
        border-color: #4b0082 !important;
        color: #4b0082 !important;
      }
      .input::placeholder {
        color: #6a5acd !important;
      }

      .modal-card-head, .modal-card-foot {
        background-color: #f5f2e0 !important;
        border-bottom-color: #4b0082 !important;
        border-top-color: #4b0082 !important;
      }

    </style>
  </head>
  <body>
  <section class="section">
    <div class="container">
      <a href="?route=group-list" hx-get="?route=group-list" hx-target="#app-content" hx-swap="innerHTML" hx-push-url="true">
        <h1 class="title">
          CashSplitter
        </h1>
      </a>
      <p class="subtitle">
        Your offline-first expense sharing app.
      </p>
    </div>
  </section>

  <main id="app-content" class="container">
    <div id="group-list" hx-get="?route=group-list" hx-trigger="load-groups from:body">
      <!-- Initial group list will be loaded here by HTMX -->
    </div>
  </main>

  <button class="button is-primary is-fab" onclick="document.getElementById('new-group-modal').classList.add('is-active')">
    +
  </button>

  <div id="new-group-modal" class="modal">
    <div class="modal-background" onclick="document.getElementById('new-group-modal').classList.remove('is-active')"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">New Group</p>
        <button class="delete" aria-label="close" onclick="document.getElementById('new-group-modal').classList.remove('is-active')"></button>
      </header>
      <section class="modal-card-body">
        <form id="new-group-form" hx-post="/api/groups" hx-target="#app-content" hx-swap="innerHTML" hx-on::after-request="this.closest('.modal').classList.remove('is-active'); this.reset()">
          <div class="field">
            <label class="label">Group Name</label>
            <div class="control">
              <input class="input" type="text" name="groupName" placeholder="e.g., Holiday Trip" required>
            </div>
          </div>
          <div class="field">
            <label class="label">Group Members</label>
            <div class="control">
              <input class="input" type="text" name="groupMembers" placeholder="Comma-separated names" required>
            </div>
          </div>
        </form>
      </section>
      <footer class="modal-card-foot">
        <button class="button is-success" onclick="document.getElementById('new-group-form').dispatchEvent(new Event('submit', { bubbles: true }))">Save changes</button>
        <button class="button" onclick="document.getElementById('new-group-modal').classList.remove('is-active')">Cancel</button>
      </footer>
    </div>
  </div>

  <style>
    .is-fab {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      border-radius: 50%;
      width: 4rem;
      height: 4rem;
      font-size: 1.5rem;
    }
  </style>

  <footer class="footer">
    <div class="content has-text-centered">
      <p>
        <strong>CashSplitter</strong> by <a href="https://carlo-colombo.github.io">Carlo Colombo</a>. Copyright 2025.
      </p>
      <p>The source code is available on <a href="https://github.com/carlo-colombo/cashsplitter-htmx-sw">GitHub</a>.</p>
      <p>Built with AI.</p>
      <p><a href="#" id="clear-cache-link">Clear Cache</a> | <a href="#" id="clear-database-link">Clear Database</a></p>
    </div>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' }).then(() => {
          // The reload logic causes race conditions in Playwright.
          // We will wait for the controller to be active in the test itself.
          navigator.serviceWorker.ready.then(() => {
            console.log('Service worker is ready. Loading content.');
            const urlParams = new URLSearchParams(window.location.search);
            const route = urlParams.get('route');
            const groupId = urlParams.get('id');

            const appContent = document.getElementById('app-content');
            if (route === 'group-detail' && groupId) {
              appContent.setAttribute('hx-get', `?route=group-detail&id=${groupId}`);
              appContent.setAttribute('hx-trigger', 'load');
              htmx.process(appContent);
              appContent.dispatchEvent(new Event('load'));
            } else {
              htmx.trigger(document.body, 'load-groups');
            }
            // Signal that the app is ready for tests
            document.body.dispatchEvent(new CustomEvent('app-ready', { bubbles: true }));
            document.body.setAttribute('data-app-ready', 'true');
          });
        }).catch(err => {
            console.error('Service Worker registration failed:', err);
        });
      });
    }

    document.getElementById('clear-cache-link').addEventListener('click', function(event) {
      event.preventDefault();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      caches.keys().then(function(cacheNames) {
        return Promise.all(
          cacheNames.map(function(cacheName) {
            return caches.delete(cacheName);
          })
        );
      }).then(function() {
        alert('Cache cleared. The page will now reload.');
        window.location.reload();
      });
    });

    document.getElementById('clear-database-link').addEventListener('click', function(event) {
      event.preventDefault();
      if (confirm('Are you sure you want to delete all data? This action cannot be undone.')) {
        const db = new Dexie('LedgerDB');
        db.delete().then(() => {
          alert('Database cleared. The page will now reload.');
          window.location.reload();
        }).catch(err => {
          console.error('Failed to delete database:', err);
          alert('Could not clear the database. See console for details.');
        });
      }
    });
  </script>
  </body>
</html>
